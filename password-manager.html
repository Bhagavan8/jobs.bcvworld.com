<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password & Document Manager - Admin Only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/password-manager.css">
</head>

<body class="admin-dashboard">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-wrapper">
                    <i class="bi bi-shield-lock-fill logo-icon"></i>
                    <h1 class="logo-text">Secure<span> Locker</span></h1>
                </div>
                <button class="sidebar-toggle d-lg-none">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="sidebar-menu">
                <ul class="nav flex-column" id="sidebarMenu">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-arrow-left"></i>
                            <span>Back to Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="password-manager.html">
                            <i class="bi bi-key"></i>
                            <span>Password Manager</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="top-header">
                <button class="sidebar-toggle d-lg-none">
                    <i class="bi bi-list"></i>
                </button>
                <div class="search-bar">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchInput" placeholder="Search passwords or documents...">
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline-secondary me-2" id="setKeyBtn">
                        <i class="bi bi-shield-lock"></i> Locker Key
                    </button>
                    <button class="btn btn-primary btn-add-new" data-bs-toggle="modal" data-bs-target="#addItemModal">
                        <i class="bi bi-plus-lg"></i> Add New
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-wrapper">
                <!-- Tabs -->
                <div class="custom-tabs mb-4">
                    <button class="tab-btn active" data-tab="passwords">
                        <i class="bi bi-pass-fill"></i> Passwords
                    </button>
                    <button class="tab-btn" data-tab="documents">
                        <i class="bi bi-file-earmark-text-fill"></i> Documents
                    </button>
                </div>

                <!-- Passwords Section -->
                <div id="passwordsSection" class="section-content active">
                    <div class="row g-4" id="passwordsGrid">
                        <!-- Password Cards will be injected here -->
                        <div class="col-12 text-center loading-spinner">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Documents Section -->
                <div id="documentsSection" class="section-content">
                    <div class="table-responsive">
                        <table class="table custom-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Type</th>
                                    <th>Date Added</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="documentsList">
                                <!-- Documents will be injected here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="documentsLoading" class="text-center loading-spinner" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="encryptionKeyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Set Locker Key</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="encryptionKeyForm">
                        <div class="mb-3">
                            <label for="encryptionKeyInput" class="form-label">Enter a strong key</label>
                            <input type="password" class="form-control" id="encryptionKeyInput" autocomplete="new-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Key</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="mfaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Two-Factor Authentication</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="mfaSetupContainer" style="display: none;">
                        <div class="mb-3">
                            <div class="alert alert-info" role="alert">
                                Enable 2FA to protect access. Add the secret to your authenticator app.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Secret</label>
                            <input type="text" class="form-control" id="mfaSecretDisplay" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">otpauth URL</label>
                            <input type="text" class="form-control" id="mfaOtpAuthUrl" readonly>
                        </div>
                        <button class="btn btn-primary w-100" id="confirmEnableMfaBtn">Confirm Enable</button>
                        <hr>
                    </div>
                    <form id="mfaForm">
                        <div class="mb-3">
                            <label for="mfaCodeInput" class="form-label">Enter 6-digit code</label>
                            <input type="text" class="form-control" id="mfaCodeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-secondary" id="setupMfaBtn">Setup 2FA</button>
                            <button type="submit" class="btn btn-primary">Verify</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Add/Edit Item Modal -->
    <div class="modal fade" id="addItemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="itemForm">
                        <input type="hidden" id="itemId">
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <div class="type-selector">
                                <input type="radio" class="btn-check" name="itemType" id="typePassword" value="password" checked>
                                <label class="btn btn-outline-primary" for="typePassword">Password</label>
                                
                                <input type="radio" class="btn-check" name="itemType" id="typeDocument" value="document">
                                <label class="btn btn-outline-primary" for="typeDocument">Document</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="itemTitle" class="form-label">Title/Name</label>
                            <input type="text" class="form-control" id="itemTitle" required>
                        </div>

                        <!-- Password Fields -->
                        <div id="passwordFields">
                            <div class="mb-3">
                                <label for="itemUsername" class="form-label">Username/Email</label>
                                <input type="text" class="form-control" id="itemUsername">
                            </div>
                            <div class="mb-3">
                                <label for="itemPassword" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="itemPassword">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="itemUrl" class="form-label">Website URL</label>
                                <input type="url" class="form-control" id="itemUrl" placeholder="https://...">
                            </div>
                        </div>

                        <!-- Document Fields -->
                        <div id="documentFields" style="display: none;">
                            <div class="mb-3">
                                <label for="fileUpload" class="form-label">Upload File</label>
                                <input type="file" class="form-control" id="fileUpload">
                                <div id="currentFile" class="form-text mt-2 text-success" style="display: none;"></div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="itemNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="itemNotes" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="saveBtn">Save Item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- View Password Modal -->
    <div class="modal fade" id="viewPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="copy-field mb-3">
                        <label>Username</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="viewUsername" readonly>
                            <button class="btn btn-outline-primary" onclick="copyToClipboard('viewUsername')">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </div>
                    </div>
                    <div class="copy-field mb-3">
                        <label>Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="viewPassword" readonly>
                            <button class="btn btn-outline-secondary" type="button" id="toggleViewPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outline-primary" onclick="copyToClipboard('viewPassword')">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3" id="viewUrlContainer">
                        <div class="d-flex align-items-center justify-content-between view-inline">
                            <span class="form-label mb-0">Website</span>
                            <div class="d-flex align-items-center gap-2">
                                <span id="viewUrlDomain" class="text-muted small d-none d-sm-inline"></span>
                                <a href="#" target="_blank" id="viewUrl" class="btn btn-outline-primary btn-sm">Open</a>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3" id="viewNotesContainer">
                        <label>Notes</label>
                        <p id="viewNotes" class="text-muted"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger" id="deleteItemBtn">Delete</button>
                    <button type="button" class="btn btn-primary" id="editItemBtn">Edit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/password-manager.js"></script>
</body>

</html>
