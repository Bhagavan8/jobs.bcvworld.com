<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload News - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Upload News Article</h2>
        <form id="uploadNewsForm">
            <div class="row mb-3">
                <div class="col-md-12">
                    <label for="newsTitle" class="form-label">Title</label>
                    <input type="text" class="form-control" id="newsTitle" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-12">
                    <label for="newsUrl" class="form-label">URL</label>
                    <input type="text" class="form-control" id="newsUrl" placeholder="Enter URL (e.g., https://example.com)">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="newsCategory" class="form-label">Category</label>
                    <select class="form-select" id="newsCategory" required>
                        <option value="">Select category</option>
                        <option value="general">General News</option>
                        <option value="local">Local</option>
                        <option value="national">National</option>
                        <option value="international">International</option>
                        <option value="sports">Sports</option>
                        <option value="technology">Technology</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="tips">Tips & Tricks</option>
                        <option value="stories">Story Telling</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="newsSection" class="form-label">Section</label>
                    <select class="form-select" id="newsSection" required>
                        <option value="">Select section</option>
                        <option value="general">General News</option>
                        <option value="featured">Featured News</option>
                        <option value="breaking">Breaking News</option>
                        <option value="recent">Recent News</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="tips">Tips & Tricks</option>
                        <option value="stories">Story Telling</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <div id="paragraphsContainer"></div>
                <button type="button" class="btn btn-secondary mt-2" id="addParagraphBtn">Add Paragraph</button>
                <div class="mt-3">
                    <label for="bulkParagraphText" class="form-label">Bulk Text (optional)</label>
                    <textarea class="form-control" id="bulkParagraphText" rows="3" placeholder="Paste text to split by '.'"></textarea>
                    <button type="button" class="btn btn-outline-secondary mt-2" id="splitParagraphsBtn">Split into paragraphs</button>
                </div>
            </div>

            <template id="paragraphTemplate">
                <div class="paragraph-item mb-2">
                    <div class="input-group">
                        <textarea class="form-control paragraph-text" rows="3" placeholder="Paragraph text"></textarea>
                        <button class="btn btn-outline-danger remove-paragraph" type="button">Remove</button>
                    </div>
                    <div class="mt-2">
                        <div class="subpoints-container"></div>
                        <button type="button" class="btn btn-sm btn-secondary add-subpoint">Add Sub-point</button>
                    </div>
                </div>
            </template>

            <template id="subpointTemplate">
                <div class="input-group mb-2 subpoint-item">
                    <textarea class="form-control subpoint-text" rows="2" placeholder="Sub-point"></textarea>
                    <button class="btn btn-outline-dark toggle-bold" type="button">Bold</button>
                    <button class="btn btn-outline-danger remove-subpoint" type="button">Remove</button>
                </div>
            </template>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="newsImageName" class="form-label">News Image Filename</label>
                    <input type="text" class="form-control" id="newsImageName" placeholder="e.g. news-1.jpg">
                    <div class="form-text text-muted">Image will be referenced from <b>assets/images/news/</b>. Ensure file exists there.</div>
                </div>
                <div class="col-md-6">
                    <label for="newsStatus" class="form-label">Approval Status</label>
                    <select class="form-select" id="newsStatus" required>
                        <option value="pending">Pending Approval</option>
                        <option value="approved">Approved</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Upload News</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/upload-news.js"></script>
</body>
</html>
