<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Practice • DSA Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/index.css">
  <style>
    .editor { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .editor textarea { width: 100%; height: 360px; padding: .75rem; border-radius: .5rem; border: 1px solid #e5e7eb; }
    .problem-list { height: 520px; overflow: auto; }
    .code-actions .btn { min-width: 110px; }
    .test-pass { color: #16a34a; }
    .test-fail { color: #dc2626; }
    .badge-difficulty { font-size: .75rem; }
  </style>
</head>
<body class="admin-dashboard">
  <div class="wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-wrapper">
          <i class="bi bi-briefcase-fill logo-icon"></i>
          <h1 class="logo-text">Finance<span> & Personal</span></h1>
        </div>
        <button class="sidebar-toggle d-lg-none"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="sidebar-menu">
        <ul class="nav flex-column" id="sidebarMenu">
          <li class="nav-item">
            <a class="nav-link" href="study-plan.html">
              <i class="bi bi-journal-check"></i><span>Study Plan & To‑Do</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="dsa-playground.html">
              <i class="bi bi-code-slash"></i><span>Coding Practice</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html">
              <i class="bi bi-house"></i><span>Home</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>
    <main class="main-content">
      <nav class="top-nav">
        <div class="d-flex align-items-center">
          <button class="sidebar-toggle d-lg-none me-3"><i class="bi bi-list"></i></button>
          <h4 class="page-title mb-0">DSA Coding Lab</h4>
        </div>
        <div class="top-nav-actions"><div id="userMenuDropdown"></div></div>
      </nav>
      <div class="content-wrapper">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div class="d-flex gap-2 align-items-center">
            <select id="categoryFilter" class="form-select form-select-sm" style="width:180px">
              <option value="">All Categories</option>
              <option>Arrays</option><option>Strings</option><option>Hash Map</option>
              <option>Two Pointers</option><option>Linked List</option><option>Stack</option>
              <option>Queue</option><option>Binary Tree</option><option>DP</option>
            </select>
            <select id="difficultyFilter" class="form-select form-select-sm" style="width:140px">
              <option value="">All Levels</option>
              <option>Easy</option><option>Medium</option><option>Hard</option>
            </select>
            <button class="btn btn-sm btn-outline-primary" id="seedProblemsBtn"><i class="bi bi-download me-1"></i>Seed Problems</button>
            <button class="btn btn-sm btn-outline-danger" id="resetProblemsBtn"><i class="bi bi-trash me-1"></i>Reset</button>
          </div>
          <div class="d-flex gap-2">
            <select id="languageSelect" class="form-select form-select-sm" style="width:150px">
              <option>JavaScript</option>
              <option>Java</option>
            </select>
          </div>
        </div>
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-header bg-white d-flex align-items-center justify-content-between">
                <span class="fw-bold">Problems</span>
                <span class="badge text-bg-primary" id="problemCount">0</span>
              </div>
              <div class="card-body problem-list" id="problemList">
                <div class="text-muted">No problems</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white d-flex align-items-center justify-content-between">
                <div>
                  <div class="fw-bold" id="problemTitle">Select a problem</div>
                  <small class="text-muted" id="problemMeta"></small>
                </div>
                <div class="code-actions d-flex gap-2">
                  <button class="btn btn-sm btn-outline-secondary" id="resetCodeBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset Code</button>
                  <button class="btn btn-sm btn-primary" id="runBtn"><i class="bi bi-play-fill me-1"></i>Run Tests</button>
                  <button class="btn btn-sm btn-success" id="submitBtn"><i class="bi bi-check2-circle me-1"></i>Submit</button>
                </div>
              </div>
              <div class="card-body">
                <div class="mb-2" id="problemDesc"></div>
                <div class="editor">
                  <textarea id="codeEditor" spellcheck="false" placeholder="// Write your solution here"></textarea>
                </div>
                <div class="mt-3">
                  <div class="fw-bold mb-1">Results</div>
                  <div id="results" class="small text-muted">No runs yet</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/dsa-playground.js"></script>
</body>
</html>
